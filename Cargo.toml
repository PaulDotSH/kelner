[package]
name = "kelner"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "signal", "fs", "io-util", "time", "net", "sync"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
sailfish = { version = "0.11.3", features = ["perf-inline"] }
sailfish-minify = "0.11.1"   # native-minifier + minify-components are default features
argon2 = "0.5.3"
rand = "0.9.5"
chrono = "0.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio-util = { version = "0.7", features = ["io"] }
hmac = "0.13"
sha2 = "0.11"

[profile.release]
opt-level = 3        # max speed
lto = "fat"          # max optimization
codegen-units = 1    # max inlining
panic = "abort"      # max less runtime overhead
strip = "symbols"    # max small binary